<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; media-src data:;"><title>筑梦喵 · Cupbox 桌宠</title><link rel="stylesheet" href="pet.css"><link rel="stylesheet" href="../ui/pet-art.css"></head><body>
